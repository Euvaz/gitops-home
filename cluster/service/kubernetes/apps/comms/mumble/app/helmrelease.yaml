---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mumble
  namespace: comms
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          main:
            image:
              repository: docker.io/mumblevoip/mumble-server
              tag: v1.6.870-4@sha256:5129662d9cbe0bc83bca152056cb9c337f592a2ad9e87fa0ea7844b4efb3d5b7
            env:
              MUMBLE_SUPERUSER_PASSWORD:
                secretKeyRef:
                  name: *app
                  key: MUMBLE_SUPERUSER_PASSWORD
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 1m
                memory: 10Mi
              limits:
                memory: 10Mi
    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "${LB_MUMBLE_IP}"
        ports:
          http:
            port: 80
          control:
            enabled: true
            port: 64738
            protocol: TCP
          voice:
            enabled: true
            port: 64738
            protocol: UDP
    persistence:
      config:
        existingClaim: mumble-config
        globalMounts:
          - path: /data/
